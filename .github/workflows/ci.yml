name: CI

on:
  push:
    branches: [main, codex/mvp-foundation]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=@sol-dorado/api
      - run: npm run build
