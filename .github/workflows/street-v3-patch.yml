name: Street V3 Patch

on:
  push:
    branches: ["codex/procedural-street-v2"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[street-v3-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/procedural-street-v2
      - name: Patch reviewed Pixi V3 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/world/ProceduralStreetBackdrop.tsx')
          text = path.read_text()

          old = '''export function ProceduralStreetBackdrop({ alerted }: { alerted: boolean }) {
            const hostRef = useStreetPixiLayer('background', alerted);
            return <div ref={hostRef} className="street-backdrop street-backdrop-pixi" style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }} aria-hidden="true" />;
          }

          export function ProceduralStreetForeground() {
            const hostRef = useStreetPixiLayer('foreground', false);
            return <div ref={hostRef} className="street-backdrop street-backdrop-pixi-foreground" style={{ position: 'absolute', inset: 0, zIndex: 18, overflow: 'hidden', pointerEvents: 'none' }} aria-hidden="true" />;
          }
          '''
          new = '''export function ProceduralStreetBackdrop({ alerted }: { alerted: boolean }) {
            const backgroundRef = useStreetPixiLayer('background', alerted);
            const foregroundRef = useStreetPixiLayer('foreground', alerted);
            return <>
              <div ref={backgroundRef} className="street-backdrop street-backdrop-pixi" style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }} aria-hidden="true" />
              <div ref={foregroundRef} className="street-backdrop street-backdrop-pixi-foreground" style={{ position: 'absolute', inset: 0, zIndex: 18, overflow: 'hidden', pointerEvents: 'none' }} aria-hidden="true" />
            </>;
          }
          '''
          if old not in text: raise SystemExit('component block not found')
          text = text.replace(old, new)

          text = text.replace(
            "    const host = hostRef.current;\n    if (!host) return;",
            "    if (hostRef.current === null) return;\n    const hostElement: HTMLDivElement = hostRef.current;"
          )
          text = text.replace("        host.replaceChildren(canvas);", "        hostElement.replaceChildren(canvas);")
          text = text.replace("        if (!disposed) host.dataset.streetRendererError = 'true';", "        if (!disposed) hostElement.dataset.streetRendererError = 'true';")
          text = text.replace("      host.replaceChildren();", "      hostElement.replaceChildren();")

          text = text.replace(
            "        else renderForeground(app.stage, source.scene);",
            "        else renderForeground(app.stage, source.scene, alerted);"
          )
          text = text.replace(
            "function renderForeground(stage: Container, scene: SceneDefinition) {\n  stage.removeChildren();\n  const palette = paletteNumbers(scene.palette);\n  drawForegroundAwnings(stage, scene, palette);",
            "function renderForeground(stage: Container, scene: SceneDefinition, alerted: boolean) {\n  stage.removeChildren();\n  const palette = paletteNumbers(scene.palette);\n  drawForegroundAwnings(stage, scene, palette, alerted);"
          )
          text = text.replace(
            "function drawForegroundAwnings(stage: Container, scene: SceneDefinition, palette: Record<string, number>) {",
            "function drawForegroundAwnings(stage: Container, scene: SceneDefinition, palette: Record<string, number>, alerted: boolean) {"
          )
          text = text.replace(
            "    const style = buildingStyle(building.style, false);",
            "    const style = buildingStyle(building.style, alerted && building.id === 'corner_store');"
          )

          old_tree = '''  for (const tree of scene.trees) {
            if (foregroundOnly !== tree.occludes) continue;
            if (roadClearance([tree.x, tree.y], scene.roads) < tree.radius + 3 || scene.buildings.some(building => pointInPolygon([tree.x, tree.y], building.footprint))) {
              console.warn(`[street-v3] skipped tree at ${tree.x},${tree.y}: invalid placement`);
              continue;
            }
            if (foregroundOnly) drawTreeCrown(stage, tree, palette, scene.seed);
            else drawTree(stage, tree, palette, scene.seed);
          }
          '''
          new_tree = '''  for (const tree of scene.trees) {
            if (foregroundOnly && !tree.occludes) continue;
            if (roadClearance([tree.x, tree.y], scene.roads) < tree.radius + 3 || scene.buildings.some(building => pointInPolygon([tree.x, tree.y], building.footprint))) {
              console.warn(`[street-v3] skipped tree at ${tree.x},${tree.y}: invalid placement`);
              continue;
            }
            if (foregroundOnly) drawTreeCrown(stage, tree, palette, scene.seed);
            else drawTree(stage, tree, palette, scene.seed);
          }
          '''
          if old_tree not in text: raise SystemExit('tree block not found')
          text = text.replace(old_tree, new_tree)

          start = text.index('function polygonClearOfRoads(')
          end_marker = "const overlapSignal = new Error('overlap');\n\n"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''function polygonClearOfRoads(points: Point[], roads: RoadDefinition[], clearance: number) {
            for (const road of roads) {
              const required = road.width / 2 + clearance;
              for (const point of points) if (distancePointToPolyline(point, road.centerline) < required) return false;
              for (let edgeIndex = 0; edgeIndex < points.length; edgeIndex += 1) {
                const a = points[edgeIndex]!;
                const b = points[(edgeIndex + 1) % points.length]!;
                for (let segmentIndex = 0; segmentIndex < road.centerline.length - 1; segmentIndex += 1) {
                  if (segmentsIntersect(a, b, road.centerline[segmentIndex]!, road.centerline[segmentIndex + 1]!)) return false;
                }
              }
            }
            return true;
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          scene_path = Path('apps/web/src/features/world/procedural-street-v2.json')
          scene = scene_path.read_text()
          scene = scene.replace('{ "x": 640, "y": 500, "radius": 14, "occludes": false }', '{ "x": 445, "y": 580, "radius": 14, "occludes": false }')
          scene_path.write_text(scene)
          PY
      - name: Commit reviewed patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/world/ProceduralStreetBackdrop.tsx apps/web/src/features/world/procedural-street-v2.json
          git commit -m "fix(world): stabilize reviewed Pixi V3 renderer [street-v3-patched]"
          git push origin HEAD:codex/procedural-street-v2
