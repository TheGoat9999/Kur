<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sol Dorado HUD v0.2</title>
<style>
:root{
  --bg:#070b0f;
  --glass:rgba(14,22,28,.46);
  --glass-strong:rgba(12,19,24,.66);
  --stroke:rgba(211,225,233,.15);
  --stroke-soft:rgba(211,225,233,.08);
  --text:#eef4f7;
  --muted:#91a0a8;
  --gold:#d9ab57;
  --health:#6fd29a;
  --energy:#7cc8e2;
  --food:#e0b664;
  --water:#78c9ed;
  --stress:#b49adf;
  --danger:#ed7770;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070b0f;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100dvh;overflow:hidden}
button{font:inherit}

.scene{
  position:relative;min-height:100dvh;overflow:hidden;
  background:
    radial-gradient(circle at 72% 18%,rgba(66,110,133,.18),transparent 30%),
    radial-gradient(circle at 22% 70%,rgba(217,171,87,.09),transparent 28%),
    linear-gradient(180deg,#101a21 0,#0b1217 52%,#05080b 100%);
}
.scene:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;
  background:
    linear-gradient(90deg,transparent 0 97%,rgba(255,255,255,.025) 97% 100%),
    linear-gradient(0deg,transparent 0 97%,rgba(255,255,255,.025) 97% 100%);
  background-size:48px 48px;
}
.cityGlow{position:absolute;inset:auto -8% -12% -8%;height:58%;background:linear-gradient(180deg,transparent,rgba(11,17,21,.1) 8%,rgba(2,4,6,.55));pointer-events:none}
.city{
  position:absolute;left:-3%;right:-3%;bottom:0;height:48%;opacity:.64;pointer-events:none;
  filter:saturate(.72);
}
.b{position:absolute;bottom:0;background:linear-gradient(180deg,#18272e,#091116);border-top:1px solid rgba(255,255,255,.03)}
.b:after{content:"";position:absolute;inset:10px;background:repeating-linear-gradient(90deg,rgba(231,192,116,.07) 0 4px,transparent 4px 18px),repeating-linear-gradient(180deg,rgba(231,192,116,.06) 0 4px,transparent 4px 22px)}
.b1{left:1%;width:12%;height:32%}.b2{left:12%;width:16%;height:47%}.b3{left:27%;width:10%;height:39%}.b4{left:36%;width:17%;height:55%}.b5{left:52%;width:12%;height:36%}.b6{left:63%;width:16%;height:61%}.b7{left:78%;width:11%;height:43%}.b8{left:88%;width:14%;height:50%}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 160px 45px rgba(0,0,0,.55);pointer-events:none}

/* Glass primitives */
.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--stroke);
  box-shadow:0 14px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
}

/* top HUD */
.topLeft{
  position:absolute;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));z-index:12;
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:16px
}
.locationMark{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(217,171,87,.15),rgba(217,171,87,.05));
  border:1px solid rgba(217,171,87,.22);color:var(--gold);font-size:17px
}
.topLeft b{display:block;font-size:11px;letter-spacing:.05em}.topLeft small{display:block;color:var(--muted);font-size:9px;margin-top:2px}

.topRight{
  position:absolute;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:12;
  display:flex;align-items:center;gap:9px;padding:8px 11px 8px 8px;border-radius:16px
}
.moneyMark{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(217,171,87,.18),rgba(217,171,87,.04));
  border:1px solid rgba(217,171,87,.24);color:var(--gold);font-size:18px;font-weight:900
}
.topRight small{display:block;color:var(--muted);font-size:8px;letter-spacing:.12em}.topRight strong{display:block;font-size:15px;margin-top:1px}

/* main browser-game HUD */
.statusDock{
  position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:14;
  display:flex;align-items:stretch;gap:7px;padding:7px;border-radius:20px
}
.stat{
  width:94px;min-height:72px;border-radius:15px;padding:9px 10px 8px;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--stroke-soft);position:relative;overflow:hidden
}
.stat:before{
  content:"";position:absolute;inset:auto 10px 7px;height:4px;border-radius:999px;background:rgba(255,255,255,.06)
}
.stat:after{
  content:"";position:absolute;left:10px;bottom:7px;height:4px;width:calc((100% - 20px) * var(--p)/100);
  max-width:calc(100% - 20px);border-radius:999px;background:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)
}
.statTop{display:flex;align-items:center;justify-content:space-between;gap:7px}
.statIcon{
  width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 24%,transparent);font-size:14px
}
.statValue{font-size:17px;font-weight:850;letter-spacing:-.02em}
.statLabel{margin-top:5px;color:var(--muted);font-size:8px;letter-spacing:.12em;font-weight:800}
.stat.low{border-color:rgba(237,119,112,.3)}
.stat.low .statValue{color:#f1a39e}

/* health gets a little more priority without going FiveM radial */
.stat.health{width:108px}
.stat.health .statIcon{width:31px;height:31px;font-size:15px}
.stat.health .statValue{font-size:19px}

/* contextual heat, hidden when irrelevant */
.heatCard{
  position:absolute;left:max(16px,env(safe-area-inset-left));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 96px);z-index:14;
  display:none;align-items:center;gap:9px;padding:8px 10px;border-radius:14px;
  background:linear-gradient(145deg,rgba(68,24,23,.44),rgba(24,14,14,.42));
  border:1px solid rgba(237,119,112,.28);backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.28)
}
.heatCard.on{display:flex}
.heatIcon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(237,119,112,.12);border:1px solid rgba(237,119,112,.24)}
.heatCard b{display:block;font-size:10px;color:#f2b2ae;letter-spacing:.08em}.heatCard small{display:block;font-size:8px;color:#bb8580;margin-top:2px}
.heatDots{display:flex;gap:4px;margin-left:3px}.heatDots i{width:7px;height:7px;border-radius:50%;background:#462725}.heatDots i.on{background:var(--danger);box-shadow:0 0 8px rgba(237,119,112,.7)}

/* tiny contextual strip: browser-game relevant */
.contextStrip{
  position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;
  display:flex;gap:6px;padding:6px;border-radius:14px
}
.contextPill{padding:6px 9px;border:1px solid var(--stroke-soft);border-radius:9px;background:rgba(255,255,255,.02);font-size:8px;color:var(--muted);letter-spacing:.07em}
.contextPill b{color:#dbe4e8}

/* test controls */
.testToggle{
  position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:30;
  border:1px solid rgba(217,171,87,.26);background:rgba(10,16,20,.62);color:#dfe7ea;border-radius:999px;
  padding:7px 10px;font-size:9px;font-weight:850;letter-spacing:.08em;backdrop-filter:blur(16px);cursor:pointer
}
.testPanel{
  position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:31;
  width:min(430px,calc(100vw - 24px));display:none;gap:6px;flex-wrap:wrap;padding:9px;border-radius:16px
}
.testPanel.on{display:flex}
.testBtn{flex:1 1 100px;border:1px solid var(--stroke-soft);background:rgba(255,255,255,.025);color:#9eadb5;border-radius:9px;padding:8px 9px;font-size:10px;cursor:pointer}
.testBtn.on{color:#fff;border-color:rgba(217,171,87,.4);background:rgba(217,171,87,.09)}
.testShade{display:none;position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.28);backdrop-filter:blur(2px)}
.testShade.on{display:block}

body.hudOff .topLeft,body.hudOff .topRight,body.hudOff .statusDock,body.hudOff .heatCard,body.hudOff .contextStrip{opacity:0;pointer-events:none}
.topLeft,.topRight,.statusDock,.heatCard,.contextStrip{transition:opacity .18s,transform .18s}

/* compact preset */
body.compact .statusDock{gap:5px;padding:5px;border-radius:16px}
body.compact .stat{width:76px;min-height:60px;padding:7px 8px}.compact .stat.health{width:88px}.compact .statIcon{width:24px;height:24px;font-size:12px}.compact .statValue{font-size:15px}.compact .stat.health .statValue{font-size:16px}
body.compact .contextStrip{display:none}

@media(max-width:760px){
  .topLeft{left:9px;top:max(9px,env(safe-area-inset-top));padding:7px 8px;border-radius:14px;max-width:58vw}
  .locationMark{width:32px;height:32px;border-radius:10px}.topLeft>div:last-child{min-width:0}.topLeft b,.topLeft small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topRight{right:9px;top:max(9px,env(safe-area-inset-top));padding:7px 8px 7px 7px;border-radius:14px;max-width:37vw}
  .moneyMark{width:32px;height:32px;border-radius:10px}.topRight strong{font-size:13px}

  .statusDock{
    left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));padding:6px;gap:5px;border-radius:17px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none
  }
  .statusDock::-webkit-scrollbar{display:none}
  .stat{flex:0 0 75px;width:75px;min-height:62px;padding:7px 8px}
  .stat.health{flex-basis:86px;width:86px}
  .statIcon{width:25px;height:25px;font-size:12px}.stat.health .statIcon{width:27px;height:27px}
  .statValue{font-size:14px}.stat.health .statValue{font-size:16px}.statLabel{font-size:7px;margin-top:4px}
  .heatCard{left:9px;bottom:84px}
  .contextStrip{display:none}

  .testToggle{top:auto;bottom:85px}
  .testPanel{top:auto;bottom:122px}
}
</style>
</head>
<body>
<div class="scene">
  <div class="cityGlow"></div>
  <div class="city">
    <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div>
    <div class="b b5"></div><div class="b b6"></div><div class="b b7"></div><div class="b b8"></div>
  </div>
  <div class="vignette"></div>

  <div class="topLeft glass">
    <div class="locationMark">⌖</div>
    <div><b>LAS PALMAS WEST</b><small>Vespucci Blvd · District 03</small></div>
  </div>

  <div class="topRight glass">
    <div class="moneyMark">$</div>
    <div><small>CASH</small><strong id="cash">$14,820</strong></div>
  </div>

  <div class="heatCard" id="heatCard">
    <div class="heatIcon">🚨</div>
    <div><b>POLICE HEAT</b><small id="heatLabel">Known disturbance</small></div>
    <div class="heatDots" id="heatDots"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="statusDock glass">
    <div class="stat health" id="healthBox" style="--p:92;--c:var(--health)">
      <div class="statTop"><div class="statIcon">♥</div><div class="statValue" id="healthVal">92</div></div>
      <div class="statLabel">HEALTH</div>
    </div>
    <div class="stat" id="energyBox" style="--p:76;--c:var(--energy)">
      <div class="statTop"><div class="statIcon">⚡</div><div class="statValue" id="energyVal">76</div></div>
      <div class="statLabel">ENERGY</div>
    </div>
    <div class="stat" id="satietyBox" style="--p:68;--c:var(--food)">
      <div class="statTop"><div class="statIcon">🍗</div><div class="statValue" id="satietyVal">68</div></div>
      <div class="statLabel">SATIETY</div>
    </div>
    <div class="stat" id="hydrationBox" style="--p:74;--c:var(--water)">
      <div class="statTop"><div class="statIcon">💧</div><div class="statValue" id="hydrationVal">74</div></div>
      <div class="statLabel">HYDRATION</div>
    </div>
    <div class="stat" id="stressBox" style="--p:18;--c:var(--stress)">
      <div class="statTop"><div class="statIcon">🧠</div><div class="statValue" id="stressVal">18</div></div>
      <div class="statLabel">STRESS</div>
    </div>
  </div>

  <div class="contextStrip glass">
    <div class="contextPill">DISTRICT <b>UNOWNED</b></div>
    <div class="contextPill">TIME <b>23:41</b></div>
  </div>

  <button class="testToggle" id="testToggle">⚙ HUD TEST</button>
  <div class="testShade" id="testShade"></div>
  <div class="testPanel glass" id="testPanel">
    <button class="testBtn on" data-scene="normal">Normal</button>
    <button class="testBtn" data-scene="low">Low needs</button>
    <button class="testBtn" data-scene="danger">Danger</button>
    <button class="testBtn" data-scene="heat">Police heat</button>
    <button class="testBtn" data-layout="standard">Standard</button>
    <button class="testBtn" data-layout="compact">Compact</button>
    <button class="testBtn" id="hideHud">Hide HUD</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const scenes={
  normal:{health:92,energy:76,satiety:68,hydration:74,stress:18,heat:0,cash:14820},
  low:{health:78,energy:18,satiety:22,hydration:16,stress:61,heat:0,cash:14820},
  danger:{health:41,energy:48,satiety:59,hydration:55,stress:84,heat:2,cash:14820},
  heat:{health:88,energy:66,satiety:62,hydration:70,stress:71,heat:4,cash:14820}
};
let state=JSON.parse(localStorage.getItem('sd_hud_v02')||'null')||{scene:'normal',layout:'standard',hidden:false};

function save(){localStorage.setItem('sd_hud_v02',JSON.stringify(state))}
function updateStat(box,valId,value,color,lowRule){
  $(valId).textContent=value;
  $(box).style.setProperty('--p',Math.max(0,Math.min(100,value)));
  $(box).style.setProperty('--c',color);
  $(box).classList.toggle('low',lowRule(value));
}
function setScene(name){
  state.scene=name;save();
  const s=scenes[name];
  updateStat('healthBox','healthVal',s.health,s.health<45?'var(--danger)':'var(--health)',v=>v<=35);
  updateStat('energyBox','energyVal',s.energy,s.energy<25?'var(--danger)':'var(--energy)',v=>v<=25);
  updateStat('satietyBox','satietyVal',s.satiety,s.satiety<25?'var(--danger)':'var(--food)',v=>v<=25);
  updateStat('hydrationBox','hydrationVal',s.hydration,s.hydration<25?'var(--danger)':'var(--water)',v=>v<=25);
  updateStat('stressBox','stressVal',s.stress,s.stress>70?'var(--danger)':'var(--stress)',v=>v>=70);
  $('cash').textContent='$'+s.cash.toLocaleString();
  $('heatCard').classList.toggle('on',s.heat>0);
  [...$('heatDots').children].forEach((x,i)=>x.classList.toggle('on',i<s.heat));
  document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('on',b.dataset.scene===name));
}
function setLayout(layout){
  state.layout=layout;save();
  document.body.classList.toggle('compact',layout==='compact');
  document.querySelectorAll('[data-layout]').forEach(b=>b.classList.toggle('on',b.dataset.layout===layout));
}
function setHidden(v){
  state.hidden=v;save();
  document.body.classList.toggle('hudOff',v);
  $('hideHud').textContent=v?'Show HUD':'Hide HUD';
}
function setPanel(open){
  $('testPanel').classList.toggle('on',open);
  $('testShade').classList.toggle('on',open);
  $('testToggle').textContent=open?'✕ CLOSE TEST':'⚙ HUD TEST';
}
$('testToggle').onclick=()=>setPanel(!$('testPanel').classList.contains('on'));
$('testShade').onclick=()=>setPanel(false);
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{setScene(b.dataset.scene);if(innerWidth<=760)setPanel(false)});
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>setLayout(b.dataset.layout));
$('hideHud').onclick=()=>setHidden(!state.hidden);

setLayout(state.layout);
setHidden(state.hidden);
setScene(state.scene);
</script>
</body>
</html>
