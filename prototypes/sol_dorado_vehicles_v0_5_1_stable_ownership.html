const WORLD={speed:4,epochReal:Date.UTC(2026,7,16,5,0,0),epochGame:Date.UTC(2026,7,16,8,0,0)};const worldNow=()=>new Date(WORLD.epochGame+(Date.now()-WORLD.epochReal)*WORLD.speed);const fresh=()=>({lang:'bg',day:1,min:860,cash:12500,health:94,energy:82,hunger:29,thirst:12,stress:8,heat:0,playerLoc:'Southside',vehicle:{uid:'corolla-main',id:'corolla',fuel:68,engine:83,body:76,tires:71,km:296587,loc:'Southside',trunk:[],locked:false,occupied:false,parking:'street'},ownedVehicles:[]});let s;try{s=JSON.parse(localStorage.getItem('sd_vehicle_v051'))||fresh()}catch(e){s=fresh()}if(!s.vehicle.uid)s.vehicle.uid='active-'+s.vehicle.id;if(!Array.isArray(s.ownedVehicles))s.ownedVehicles=[];if(!s.ownedVehicles.some(v=>v.uid===s.vehicle.uid))s.ownedVehicles.unshift(s.vehicle);const t=k=>I[s.lang][k]??k;const save=()=>localStorage.setItem('sd_vehicle_v051',JSON.stringify(s));
function tm(){let d=worldNow();return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')}function worldDate(){let d=worldNow(),bgD=['НЕД','ПОН','ВТО','СРЯ','ЧЕТ','ПЕТ','СЪБ'],enD=['SUN','MON','TUE','WED','THU','FRI','SAT'],bgM=['ЯНУ','ФЕВ','МАР','АПР','МАЙ','ЮНИ','ЮЛИ','АВГ','СЕП','ОКТ','НОЕ','ДЕК'],enM=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];return s.lang==='bg'?bgD[d.getUTCDay()]+' '+d.getUTCDate()+' '+bgM[d.getUTCMonth()]:enD[d.getUTCDay()]+' '+d.getUTCDate()+' '+enM[d.getUTCMonth()]}function car(){return s.vehicle?cars.find(c=>c.id===s.vehicle.id):null}function toast(a,b){$('toastTitle').textContent=a;$('toastText').textContent=b;$('toast').classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>$('toast').classList.remove('on'),2600)}
function nav(){const N=(ico,label,id)=>`<button class="nav" data-go="${id}"><span>${ico}</span>${label}</button>`,G=(x,a)=>`<div class="group">${x}</div>${a.join('')}`;$('nav').innerHTML=G(t('world'),[N('🗺️',t('cityMap'),'world'),N('🧭',t('travel'),'travel')])+G(t('character'),[N('🚗',s.lang==='bg'?'Моите автомобили':'My Vehicles','garage'),N('🏷️',t('dealer'),'dealer')])+G(t('system'),[N('🧪',t('featureProgress'),'progressPage'),N('⚙️',t('settings'),'settings')]);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go))}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));$('drawer').classList.remove('open');render()}
function hud(){const hv=[['health',t('health'),s.health,'',s.health],['energy',t('energy'),s.energy,'energy',s.energy],['full',t('fullness'),100-s.hunger,'hunger',100-s.hunger],['water',t('hydration'),100-s.thirst,'hydration',100-s.thirst],['stress',t('stress'),s.stress,'stress',s.stress],['heat',t('police'),s.heat,'heat',s.heat],['money',t('money'),s.cash,'money',s.cash]];$('globalHud').innerHTML=hv.map(x=>`<div class="hudv ${x[3]}"><div class="hl"><span>${x[1]}</span><span class="hn">${x[3]==='money'?'$'+Math.round(x[4]):Math.round(x[4])}</span></div><div class="hudbar"><div class="hudfill" style="width:${clamp(x[2])}%"></div></div></div>`).join('')}
function renderMap(){document.querySelectorAll('.district').forEach(b=>{b.innerHTML=`<b>${t(b.dataset.dest)}</b><small>${b.dataset.dest===s.playerLoc?'● '+t('youAre'):''}</small>`;b.classList.toggle('on',b.dataset.dest===s.playerLoc);b.onclick=()=>openMethods(b.dataset.dest)});let p=DIST[s.playerLoc];$('playerPin').style.left=p.x+'%';$('playerPin').style.top=p.y+'%';if(s.vehicle){let v=DIST[s.vehicle.loc];$('carPin').style.display='block';$('carPin').style.left=(v.x+6)+'%';$('carPin').style.top=v.y+'%'}else $('carPin').style.display='none';$('locationText').textContent=t('youAre')+': '+t(s.playerLoc);$('playerLegend').textContent=t('playerLegend');$('carLegend').textContent=t('carLegend')}
function conditionLabel(v){return v>=75?t('good'):v>=50?t('fair'):v>=25?t('poor'):t('critical')}
function vehicleHTML(){let c=car();if(!c)return `<h3>🚗 ${t('noVehicle')}</h3><div class="muted">${t('noVehicleDesc')}</div>`;let here=s.vehicle.loc===s.playerLoc;return `<div class="vehicleTitle"><div><div class="ey">${t('vehicle')}</div><h2>🚗 ${c.name}</h2></div><span class="chip green">${s.vehicle.occupied?t('inVehicle'):t('parked')}: ${t(s.vehicle.loc)}</span></div><div class="vstats"><div class="vstat"><small>${t('fuel')}</small><b>${s.vehicle.fuel}%</b></div><div class="vstat"><small>${t('engine')}</small><b>${s.vehicle.engine}%</b></div><div class="vstat"><small>${t('tires')}</small><b>${s.vehicle.tires}%</b></div><div class="vstat"><small>${t('body')}</small><b>${s.vehicle.body}%</b></div><div class="vstat"><small>${t('mileage')}</small><b>${s.vehicle.km.toLocaleString()} km</b></div><div class="vstat"><small>${t('reliability')}</small><b>${c.rel}/100</b></div><div class="vstat"><small>${t('performance')}</small><b>${c.perf}/100</b></div><div class="vstat"><small>${t('comfort')}</small><b>${c.comfort}/100</b></div><div class="vstat"><small>${t('cargo')}</small><b>${c.cargo}</b></div><div class="vstat"><small>${t('parkingType')}</small><b>${s.vehicle.parking==='home'?t('homeParking'):t('streetParking')}</b></div></div>${here?`<div class="vactions"><button class="vbtn primary" id="enterExit">${s.vehicle.occupied?'🚪 '+t('exitVehicle'):'🔑 '+t('enterVehicle')}</button><button class="vbtn" id="lockToggle">${s.vehicle.locked?'🔓 '+t('unlock'):'🔒 '+t('lock')}</button><button class="vbtn" id="inspectVehicle">🔎 ${t('inspect')}</button></div><div id="inspectionBox" class="parkingNote" style="display:none"></div>`:''}`}
function openMethods(dest){if(dest===s.playerLoc){toast(t('samePlace'),t(dest));return}show('travel');setTimeout(()=>{document.querySelector(`[data-choose="${dest}"]`)?.click()},0)}
function travelStats(dest){let d=distance[s.playerLoc][dest];return{d,walkSec:Math.min(90,Math.max(18,Math.round(d*5.5))),busSec:Math.min(42,Math.max(16,Math.round(d*2.5+8))),taxiSec:Math.min(18,Math.max(7,Math.round(d*.8+5))),carSec:Math.min(16,Math.max(6,Math.round(d*.65+4))),walkE:Math.max(4,Math.round(d*1.4)),busCost:Math.max(2,Math.round(d*.45)),taxiCost:Math.max(9,Math.round(d*2.2)),fuel:Math.max(2,Math.round(d*.55))}}

function methods(dest){let q=travelStats(dest),available=s.vehicle&&s.vehicle.loc===s.playerLoc,ready=available&&s.vehicle.occupied;return `<div class="travelMethods"><button class="method" data-method="walk" data-dest="${dest}"><span class="ico">🚶</span><span><b>${t('walk')}</b><small>${secLabel(q.walkSec)} · ${t('walkEffect')}</small></span><span class="cost">${t('free')}<br>-${q.walkE} ${t('energy')}</span></button><button class="method" data-method="bus" data-dest="${dest}" ${s.cash<q.busCost?'disabled':''}><span class="ico">🚌</span><span><b>${t('bus')}</b><small>${secLabel(q.busSec)} · ${t('busEffect')}</small></span><span class="cost">$${q.busCost}<br>-2 ${t('energy')}</span></button><button class="method" data-method="taxi" data-dest="${dest}" ${s.cash<q.taxiCost?'disabled':''}><span class="ico">🚕</span><span><b>${t('taxi')}</b><small>${secLabel(q.taxiSec)} · ${t('taxiEffect')}</small></span><span class="cost">$${q.taxiCost}<br>0 ${t('energy')}</span></button><button class="method" data-method="car" data-dest="${dest}" ${!ready||s.vehicle.fuel<q.fuel?'disabled':''}><span class="ico">🚗</span><span><b>${t('ownCar')}</b><small>${available?(s.vehicle.occupied?secLabel(q.carSec)+' · '+t('carEffect'):t('mustEnter')):t('unavailableCar')}</small></span><span class="cost">-${q.fuel}% ${t('fuelUse')}<br>0 ${t('energy')}</span></button></div>`}
function doTravel(method,dest){let q=travelStats(dest),seconds=0,cost=0,en=0,fuel=0;if(method==='walk'){seconds=q.walkSec;en=q.walkE}if(method==='bus'){seconds=q.busSec;cost=q.busCost;en=2}if(method==='taxi'){seconds=q.taxiSec;cost=q.taxiCost}if(method==='car'){if(!s.vehicle||s.vehicle.loc!==s.playerLoc){toast(t('unavailableCar'),t('notWithCar'));return}if(!s.vehicle.occupied){toast(t('mustEnter'),'');return}if(s.vehicle.fuel<q.fuel){toast(t('outOfFuel'),'');return}seconds=q.carSec;fuel=q.fuel}if(s.cash<cost){toast(t('notEnough'),'');return}$('overlayEy').textContent=t('route');$('overlayTitle').textContent=t('travelling')+' '+t(dest);$('overlayText').textContent=`${secLabel(seconds)}${cost?' · $'+cost:''}${en?' · -'+en+' '+t('energy'):''}${fuel?' · -'+fuel+'% '+t('fuelUse'):''}`;$('overlay').classList.add('on');$('progressBar').style.transition='none';$('progressBar').style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{$('progressBar').style.transition=`width ${seconds}s linear`;$('progressBar').style.width='100%'}));setTimeout(()=>{s.cash-=cost;s.energy=clamp(s.energy-en);if(method==='car'){let c=car(),wear=Math.max(.15,(100-c.rel)/110);s.vehicle.fuel=clamp(s.vehicle.fuel-fuel);s.vehicle.km+=q.d;s.vehicle.engine=Math.max(0,+(s.vehicle.engine-wear*q.d/10).toFixed(1));s.vehicle.tires=Math.max(0,+(s.vehicle.tires-wear*q.d/8).toFixed(1));s.vehicle.loc=dest;s.vehicle.parking=dest==='Southside'?'home':'street'}s.playerLoc=dest;save();$('overlay').classList.remove('on');$('progressBar').style.transition='none';$('progressBar').style.width='0';show('world');let extra='';if(method==='walk'&&Math.random()<.55)extra=s.lang==='bg'?' · По пътя забеляза нещо интересно.':' · You noticed something interesting on the way.';else if(method==='car'&&Math.random()<.25)extra=s.lang==='bg'?' · Пътуването добави автомобилно събитие към бъдещия road-event слой.':' · The trip triggered the future road-event layer.';toast(t('arrived'),t('arrivedText')+' '+t(dest)+extra)},seconds*1000)}
function renderTravel(){let ds=Object.keys(DIST).filter(x=>x!==s.playerLoc);$('destinations').innerHTML=ds.map(d=>`<div class="listitem"><div><b>📍 ${t(d)}</b><small>${distance[s.playerLoc][d]} km</small></div><button class="vbtn primary" data-choose="${d}">${t('selectMethod')}</button></div><div id="methods-${d}" style="display:none"></div>`).join('');document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[id^="methods-"]').forEach(x=>x.style.display='none');let box=$('methods-'+b.dataset.choose);box.innerHTML=methods(b.dataset.choose);box.style.display='block';box.querySelectorAll('[data-method]').forEach(m=>m.onclick=()=>doTravel(m.dataset.method,m.dataset.dest))})}
function bindVehicleLife(){if(!s.vehicle||s.vehicle.loc!==s.playerLoc)return;let enter=$('enterExit'),lock=$('lockToggle'),inspect=$('inspectVehicle');if(enter)enter.onclick=()=>{if(s.vehicle.locked&&!s.vehicle.occupied)return toast(t('vehicleLocked'),'');s.vehicle.occupied=!s.vehicle.occupied;save();render();toast(s.vehicle.occupied?t('entered'):t('exited'),car().name)};if(lock)lock.onclick=()=>{if(s.vehicle.occupied)return toast(t('inVehicle'),s.lang==='bg'?'Първо излез от автомобила.':'Exit the vehicle first.');s.vehicle.locked=!s.vehicle.locked;save();render();toast(t('lockChanged'),s.vehicle.locked?t('locked'):t('unlocked'))};if(inspect)inspect.onclick=()=>{let x=$('inspectionBox');x.style.display=x.style.display==='none'?'block':'none';x.innerHTML=`<b>🔎 ${t('inspectionTitle')}</b><br>${t('engine')}: ${conditionLabel(s.vehicle.engine)} (${s.vehicle.engine}%)<br>${t('tires')}: ${conditionLabel(s.vehicle.tires)} (${s.vehicle.tires}%)<br>${t('body')}: ${conditionLabel(s.vehicle.body)} (${s.vehicle.body}%)<br>${t('fuel')}: ${s.vehicle.fuel}% · ${t('range')}: ~${Math.round(s.vehicle.fuel*4.2)} km<br><small>${t('wearNote')}</small>`}}
function addFuel(dollars){if(!s.vehicle||s.vehicle.loc!==s.playerLoc||s.playerLoc!=='Southside')return toast(t('gasOnlyHere'),'');if(s.cash<dollars)return toast(t('notEnough'),'');let liters=dollars/1.12,percent=liters/50*100,actual=Math.min(percent,100-s.vehicle.fuel),cost=Math.ceil(actual/100*50*1.12);s.cash-=cost;s.vehicle.fuel=clamp(s.vehicle.fuel+actual);save();render();toast(t('refueled'),t('refuelOk'))}
function renderGarage(){let owned=s.ownedVehicles||[s.vehicle];$('garageContent').innerHTML=`<div class="ey">${s.lang==='bg'?'МОИТЕ АВТОМОБИЛИ':'MY VEHICLES'}</div><h2>${s.lang==='bg'?'Моите автомобили':'My Vehicles'} · ${owned.length}</h2><p class="muted">${s.lang==='bg'?'Това е списък на притежаваните автомобили, не гараж. Всеки автомобил остава на физическото си местоположение.':'This is your owned vehicle list, not a garage. Each vehicle remains at its physical location.'}</p><div class="collectionList">${owned.map(v=>{let c=cars.find(x=>x.id===v.id),active=v.uid===s.vehicle.uid;return `<div class="collectionRow"><div class="collectionHead"><div><b>🚗 ${c.name}</b><div class="collectionMeta">📍 ${t(v.loc)} · ${(v.km||0).toLocaleString()} km · ${s.lang==='bg'?'Гориво':'Fuel'} ${v.fuel}%</div></div><span class="chip ${active?'green':''}">${active?(s.lang==='bg'?'АКТИВЕН':'ACTIVE'):(s.lang==='bg'?'ПАРКИРАН':'PARKED')}</span></div><div class="vactions">${active?`<button class="vbtn primary">${s.lang==='bg'?'Избран автомобил':'Selected vehicle'}</button>`:(v.loc===s.playerLoc?`<button class="vbtn selectOwned" data-uid="${v.uid}">${s.lang==='bg'?'Избери за каране':'Choose to drive'}</button>`:`<button class="vbtn locateOwned" data-uid="${v.uid}">📍 ${s.lang==='bg'?'Намери':'Locate'}</button>`)}</div></div>`}).join('')}</div>${vehicleHTML()}<div class="parkingNote"><b>⛽ ${t('gasStation')} · Southside</b><br>${t('gasDesc')}<div class="vactions"><button class="vbtn" id="fuel10">${t('fuel10')}</button><button class="vbtn" id="fuel20">${t('fuel20')}</button><button class="vbtn primary" id="fuelFull">${t('fillTank')}</button></div></div>`;bindVehicleLife();document.querySelectorAll('.locateOwned').forEach(b=>b.onclick=()=>{let v=owned.find(x=>x.uid===b.dataset.uid),c=cars.find(x=>x.id===v.id);toast(s.lang==='bg'?'МЕСТОПОЛОЖЕНИЕ':'LOCATION',c.name+' · '+t(v.loc))});document.querySelectorAll('.selectOwned').forEach(b=>b.onclick=()=>{let i=owned.findIndex(x=>x.uid===b.dataset.uid);if(i<0)return;let next=owned[i];if(next.loc!==s.playerLoc)return;let old=s.vehicle;old.occupied=false;owned[owned.findIndex(x=>x.uid===old.uid)]=old;s.vehicle=next;s.vehicle.occupied=false;save();render();toast(s.lang==='bg'?'ИЗБРАН АВТОМОБИЛ':'VEHICLE SELECTED',cars.find(x=>x.id===next.id).name)});$('fuel10').disabled=s.playerLoc!=='Southside'||s.vehicle.loc!==s.playerLoc;$('fuel20').disabled=$('fuel10').disabled;$('fuelFull').disabled=$('fuel10').disabled;$('fuel10').onclick=()=>addFuel(10);$('fuel20').onclick=()=>addFuel(20);$('fuelFull').onclick=()=>addFuel(9999)}
function ratingDots(n){let q=Math.max(1,Math.min(5,Math.round(n/20)));return '●'.repeat(q)+'○'.repeat(5-q)}
function renderDealer(){let ownedIds=new Set((s.ownedVehicles||[s.vehicle]).map(v=>v.id)),available=cars.filter(c=>!ownedIds.has(c.id));$('dealerGrid').innerHTML=`<div class="ey">${t('dealer')}</div><h2>🏢 ${t('dealer')}</h2><p class="muted">${s.lang==='bg'?'Подбрани употребявани автомобили в Sol Dorado. Притежаваните модели не се показват.':'Curated used vehicles in Sol Dorado. Models you own are hidden.'}</p><div class="dealerCards">${available.map(c=>`<div class="dealerCard"><div class="dealerHead"><div><b>${c.name}</b><div class="dealerChips"><span>${c.id==='f150'?'PICKUP':'SEDAN'}</span><span>${c.id==='bmw'?'RWD':'FWD'}</span><span>${s.lang==='bg'?'УПОТРЕБЯВАН':'USED'}</span></div></div><div class="dealerPrice">$${c.price.toLocaleString()}</div></div><div class="collectionMeta">${c.id==='bmw'?'142,800':'118,600'} km · ${s.lang==='bg'?'Бензин · Автоматик':'Petrol · Automatic'}</div><div class="dealerRating"><b>${s.lang==='bg'?'Надеждност':'Reliability'}</b><i>${ratingDots(c.rel)}</i></div><div class="dealerRating"><b>${s.lang==='bg'?'Динамика':'Performance'}</b><i>${ratingDots(c.perf)}</i></div><div class="dealerRating"><b>${s.lang==='bg'?'Комфорт':'Comfort'}</b><i>${ratingDots(c.comfort)}</i></div><div class="dealerRating"><b>${s.lang==='bg'?'Товар':'Cargo'}</b><i>${ratingDots(Math.min(100,c.cargo*4))}</i></div><p class="collectionMeta">${c.id==='bmw'?(s.lang==='bg'?'Спортен седан с добър комфорт и по-висока цена за поддръжка.':'Sport sedan with good comfort and higher maintenance costs.'):(s.lang==='bg'?'Практичен пикап с голям товарен капацитет и по-висок разход.':'Practical pickup with large cargo capacity and higher fuel use.')}</p><button class="vbtn primary buyCar" data-id="${c.id}">${s.lang==='bg'?'Купи':'Buy'}</button></div>`).join('')}</div>`;document.querySelectorAll('.buyCar').forEach(b=>b.onclick=()=>buyCar(b.dataset.id))}
function buyCar(id){let c=cars.find(x=>x.id===id);if(!c)return;if((s.ownedVehicles||[]).some(v=>v.id===id))return;if(s.cash<c.price)return toast(t('notEnough'),'');s.cash-=c.price;let v={uid:id+'-'+Date.now(),id:c.id,fuel:72,engine:100,body:100,tires:100,km:c.id==='bmw'?142800:118600,loc:s.playerLoc,trunk:[],locked:false,occupied:false,parking:'street'};s.ownedVehicles.push(v);save();render();toast(s.lang==='bg'?'АВТОМОБИЛЪТ Е КУПЕН':'VEHICLE PURCHASED',c.name+' · '+t(v.loc))}
function renderProgress(){ $('featureList').innerHTML=features.map(([n,st])=>`<div class="feature"><span>${s.lang==='bg'?featureBg[n]:n}</span><b class="status ${st}">${t(st)}</b></div>`).join('')}
function labels(){document.documentElement.lang=s.lang;$('day').textContent=worldDate();$('clock').textContent=tm();$('worldEy').textContent=t('worldEy');$('worldTitle').textContent=t('worldTitle');$('worldDesc').textContent=t('worldDesc');$('mapTitle').textContent=t('mapTitle');$('vehicleCard').innerHTML=vehicleHTML();$('parkingTitle').textContent=t('parkingTitle');$('parkingNote').textContent=t('parkingNote');$('travelEy').textContent=t('travelEy');$('travelTitle').textContent=t('travelTitle');$('travelDesc').textContent=t('travelDesc');$('destinationTitle').textContent=t('destination');$('garageEy').textContent=t('garageEy');$('garageTitle').textContent=t('garageTitle');$('garageDesc').textContent=t('garageDesc');$('dealerEy').textContent=t('dealerEy');$('dealerTitle').textContent=t('dealerTitle');$('dealerDesc').textContent=t('dealerDesc');$('progressEy').textContent=t('progressEy');$('progressTitle').textContent=t('progressTitle');$('progressDesc').textContent=t('progressDesc');$('settingsEy').textContent=t('settingsEy');$('settingsTitle').textContent=t('settingsTitle');$('settingsDesc').textContent=t('settingsDesc');$('languageTitle').textContent=t('language');$('reset').textContent='↻ '+t('reset');document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('on',b.dataset.lang===s.lang))}
function render(){nav();hud();labels();renderMap();renderTravel();renderGarage();renderDealer();renderProgress();bindVehicleLife()}
$('hamb').onclick=()=>$('drawer').classList.add('open');$('close').onclick=$('shade').onclick=()=>$('drawer').classList.remove('open');document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>{s.lang=b.dataset.lang;save();render()});$('reset').onclick=()=>{let l=s.lang;s=fresh();s.lang=l;save();show('world')};setInterval(()=>{if($('clock'))$('clock').textContent=tm();if($('day'))$('day').textContent=worldDate()},1000);render();})();
</script></body></html>
